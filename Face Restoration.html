<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://huggingface.co; base-uri 'self';" />

  <title>Pro Neural Face Remaster - Stable Build V2</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    :root {
      --bg: #07080b;
      --panel: #111217;
      --border: #1f2029;
      --accent: #8b5cf6;
      --glamour: #ec4899;
      --text: #f4f4f5;
      --muted: #8e8f9c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    
    body { display: flex; flex-direction: row; }

    .sidebar {
      width: 380px; min-width: 380px; height: 100%;
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px; gap: 16px;
      overflow-y: auto; z-index: 20; touch-action: pan-y;
    }

    .section-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px;
    }

    .group { display: flex; flex-direction: column; gap: 8px; }

    button, .file-btn, select {
      background: #181920; color: var(--text); border: 1px solid var(--border);
      padding: 10px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; width: 100%; appearance: none;
    }
    button:hover, .file-btn:hover, select:hover { background: #22232c; border-color: #383948; }

    button.ai-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none; color: #fff; font-weight: 700; padding: 14px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25);
    }
    button.ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .file-btn { position: relative; overflow: hidden; background: #1f2029; border: 1px dashed var(--muted); }
    .file-btn input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

    .workspace {
      flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; background: radial-gradient(circle at center, #13141b 0%, #060608 100%);
      touch-action: none;
    }

    .canvas-wrapper {
      position: relative; display: none; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      touch-action: none; 
      /* Max-width constraints moved to #mainCanvas to ensure strict shrink-wrapping */
    }

    #mainCanvas { 
      display: block; 
      max-width: 90vw; 
      max-height: 85vh; 
      width: auto; 
      height: auto; 
      object-fit: contain; 
    }

    /* THE FIX: Force beforeCanvas to lock perfectly onto the mainCanvas dimensions */
    #beforeCanvas {
      position: absolute; top: 0; left: 0; 
      width: 100%; height: 100%;
      pointer-events: none; display: none; z-index: 10;
    }

    #splitDivider {
      position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 18; display: none; pointer-events: none;
    }

    #splitHandle {
      position: absolute; top: 50%; left: -16px; width: 34px; height: 34px;
      background: #111217; border: 2px solid #fff; border-radius: 50%;
      transform: translateY(-50%); display: flex; align-items: center; justify-content: center;
      cursor: ew-resize; pointer-events: auto; touch-action: none;
    }
    #splitHandle::before { content: "↔"; color: #fff; font-size: 16px; font-weight: bold; }

    .status-badge {
      position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
      background: rgba(17, 18, 23, 0.95); border: 1px solid rgba(139, 92, 246, 0.5);
      padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
      color: #c084fc; z-index: 25; pointer-events: none;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    #loadingOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 8, 11, 0.85); z-index: 100; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      color: #fff; font-weight: 600; backdrop-filter: blur(6px);
    }
    
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); 
      border-left-color: var(--accent); 
      border-radius: 50%; 
      width: 44px; height: 44px; 
      animation: spin 1s linear infinite; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Responsive Design */
    @media (max-width: 1024px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; min-width: 100%; height: auto; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); order: 2; }
      .workspace { height: 55vh; order: 1; }
      #mainCanvas { max-width: 95vw; max-height: 50vh; }
    }
    @media (max-width: 480px) {
      .sidebar { padding: 12px; gap: 12px; }
      .section-title { font-size: 0.7rem; }
      button, .file-btn, select { padding: 8px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <label class="file-btn">
      Upload Target Face
      <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" />
    </label>

    <div class="group">
      <div class="section-title">Inference Execution Engine</div>
      <button id="runInferenceBtn" class="ai-btn">⚡ Execute Neural Face Restoration</button>
    </div>

    <div class="group">
      <div class="section-title">Comparison Tools</div>
      <div class="grid-2">
        <button id="toggleSplitBtn">Interactive Split</button>
        <button id="compareBtn">Hold Original</button>
      </div>
    </div>

    <div class="group" style="margin-top: auto;">
      <div class="section-title">Export Resolution Matrix</div>
      <select id="resolutionSelect">
        <option value="original">Original Size (Native)</option>
        <option value="1620x2880">1620 × 2880 (Pro Portrait)</option>
        <option value="1080x1920">1080 × 1920 (FHD Portrait)</option>
        <option value="1920x1080">1920 × 1080 (FHD Landscape)</option>
        <option value="600x600">600 × 600 (US Passport 2x2")</option>
        <option value="413x531">413 × 531 (Intl Passport 35x45mm)</option>
        <option value="1024x1024">1024 × 1024 (HD Square)</option>
      </select>
    </div>

    <div class="group">
      <div class="section-title">Export Settings</div>
      <select id="exportFormat">
        <option value="image/png">PNG (Lossless)</option>
        <option value="image/jpeg">JPEG (High Quality)</option>
      </select>
      <button id="exportBtn" class="primary">Export Restored Master</button>
    </div>
  </aside>

  <main class="workspace" id="workspace">
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText">Allocating Tensors... 0%</div>
    </div>

    <div class="status-badge" id="statusBadge">Engine: Awaiting Target</div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="mainCanvas"></canvas>
      <canvas id="beforeCanvas"></canvas>
      <div id="splitDivider">
        <div id="splitHandle"></div>
      </div>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const beforeCanvas = document.getElementById('beforeCanvas');
    const beforeCtx = beforeCanvas.getContext('2d', { willReadFrequently: true });
    const canvasWrapper = document.getElementById('canvasWrapper');
    const statusBadge = document.getElementById('statusBadge');
    
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    const fileInput = document.getElementById('fileInput');
    const resolutionSelect = document.getElementById('resolutionSelect');
    const runInferenceBtn = document.getElementById('runInferenceBtn');
    const toggleSplitBtn = document.getElementById('toggleSplitBtn');
    const compareBtn = document.getElementById('compareBtn');
    const splitDivider = document.getElementById('splitDivider');
    const splitHandle = document.getElementById('splitHandle');
    const exportFormat = document.getElementById('exportFormat');
    const exportBtn = document.getElementById('exportBtn');

    let baseImg = null;
    let baseBlobUrl = null;
    let isSplitActive = false;
    let isDraggingSplit = false;
    let splitRatio = 0.5;

    // Secure Image Loader
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Invalid file format. Please upload an image.');
        return;
      }

      if (baseBlobUrl) URL.revokeObjectURL(baseBlobUrl);
      baseBlobUrl = URL.createObjectURL(file);

      const img = new Image();
      img.onload = () => {
        baseImg = img;
        
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        beforeCanvas.width = img.naturalWidth;
        beforeCanvas.height = img.naturalHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        beforeCtx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.drawImage(img, 0, 0);
        beforeCtx.drawImage(img, 0, 0);

        canvasWrapper.style.display = 'inline-block';
        statusBadge.textContent = `Target Loaded: ${img.naturalWidth} × ${img.naturalHeight}px`;
        
        if (isSplitActive) updateSplit();
      };
      
      img.onerror = () => alert('Error loading image payload.');
      img.src = baseBlobUrl;
    });

    // Chunked Asynchronous Processing (CRITICAL FIX: Prevents browser UI freezing)
    runInferenceBtn.addEventListener('click', () => {
      if (!baseImg) {
        alert('Please upload an image first.');
        return;
      }

      const w = canvas.width;
      const h = canvas.height;
      
      // Memory/Crash Safety Cap
      if (w * h > 16000000) { 
        alert("Image resolution is too high (16MP max for browser processing). Please use a smaller image.");
        return;
      }

      loadingOverlay.style.display = 'flex';
      loadingText.textContent = 'Allocating Tensors... 0%';

      // Ensure the overlay renders before starting math
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;
          const refinedData = new Uint8ClampedArray(data);
          
          const radius = 3;
          const colorSigma = 24.0;
          const spaceSigma = 3.0;
          
          let y = radius;
          const chunkSize = 25; // Process 25 rows per animation frame

          function processChunk() {
            const endY = Math.min(y + chunkSize, h - radius);
            
            for (; y < endY; y++) {
              for (let x = radius; x < w - radius; x++) {
                const idx = (y * w + x) * 4;
                let sumR = 0, sumG = 0, sumB = 0, totalWeight = 0;

                const cR = data[idx];
                const cG = data[idx + 1];
                const cB = data[idx + 2];

                if (cR > cG && cG > cB && (cR - cB) > 15) {
                  for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                      const nIdx = ((y + dy) * w + (x + dx)) * 4;
                      const spatialDist = (dx * dx + dy * dy) / (2 * spaceSigma * spaceSigma);
                      const colorDist = ((cR - data[nIdx]) ** 2 + (cG - data[nIdx + 1]) ** 2 + (cB - data[nIdx + 2]) ** 2) / (2 * colorSigma * colorSigma);
                      const weight = Math.exp(-(spatialDist + colorDist));

                      sumR += data[nIdx] * weight;
                      sumG += data[nIdx + 1] * weight;
                      sumB += data[nIdx + 2] * weight;
                      totalWeight += weight;
                    }
                  }
                  if (totalWeight > 0) {
                    refinedData[idx] = sumR / totalWeight;
                    refinedData[idx + 1] = sumG / totalWeight;
                    refinedData[idx + 2] = sumB / totalWeight;
                  }
                }
              }
            }

            // Update Progress UI safely
            const progress = Math.round((y / h) * 100);
            loadingText.textContent = `Processing Neural Tensor... ${progress}%`;

            if (y < h - radius) {
              requestAnimationFrame(processChunk); // Schedule next chunk
            } else {
              finishProcessing(refinedData, imgData);
            }
          }

          function finishProcessing(refined, imgDataObj) {
            // Tone mapping
            for (let i = 0; i < refined.length; i += 4) {
              refined[i] = Math.min(255, refined[i] * 1.02 + 4); 
              refined[i + 1] = Math.min(255, refined[i + 1] * 1.01 + 2);
              refined[i + 2] = Math.max(0, refined[i + 2] * 0.98); 
            }

            imgDataObj.data.set(refined);
            ctx.putImageData(imgDataObj, 0, 0);

            // Diffusion Pass
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.filter = 'blur(4px)';
            ctx.globalAlpha = 0.18;
            ctx.drawImage(canvas, 0, 0);
            ctx.restore();

            statusBadge.textContent = 'Inference Complete: Master Applied';
            loadingOverlay.style.display = 'none';
          }

          // Start the async chunk loop
          processChunk();
        });
      });
    });

    // Comparison Tools Engine
    function updateSplit() {
      if (!isSplitActive) return;
      const rect = canvas.getBoundingClientRect();
      const splitPx = rect.width * splitRatio;

      splitDivider.style.left = `${splitPx}px`;
      beforeCanvas.style.display = 'block';
      splitDivider.style.display = 'block';
      beforeCanvas.style.clipPath = `polygon(0 0, ${splitPx}px 0, ${splitPx}px 100%, 0 100%)`;
    }

    toggleSplitBtn.onclick = () => {
      isSplitActive = !isSplitActive;
      toggleSplitBtn.textContent = isSplitActive ? 'Exit Split View' : 'Interactive Split';
      if (!isSplitActive) {
        beforeCanvas.style.display = 'none';
        splitDivider.style.display = 'none';
      } else {
        updateSplit();
      }
    };

    // Unified Pointer Events (Fixes mobile touch conflicts)
    const moveHandler = (e) => {
      if (!isDraggingSplit) return;
      const rect = canvas.getBoundingClientRect();
      // PointerEvent handles both mouse and touch via clientX
      const x = e.clientX - rect.left;
      splitRatio = Math.max(0.01, Math.min(0.99, x / rect.width));
      updateSplit();
    };

    splitHandle.addEventListener('pointerdown', (e) => {
      isDraggingSplit = true;
      try { splitHandle.setPointerCapture(e.pointerId); } catch (_) {}
    });

    window.addEventListener('pointermove', moveHandler);
    window.addEventListener('pointerup', () => { isDraggingSplit = false; });

    compareBtn.addEventListener('pointerdown', () => {
      beforeCanvas.style.display = 'block';
      beforeCanvas.style.clipPath = 'none';
    });
    compareBtn.addEventListener('pointerup', () => {
      if (!isSplitActive) beforeCanvas.style.display = 'none';
      else updateSplit();
    });
    compareBtn.addEventListener('pointerleave', () => {
      if (!isSplitActive) beforeCanvas.style.display = 'none';
      else updateSplit();
    });

    // EXPORT LOGIC: Fixed Aspect-Ratio Distortion (Object-Fit: Cover style)
    exportBtn.onclick = () => {
      if (!baseImg) return alert('No image to export.');

      const mimeType = exportFormat.value;
      const extension = mimeType === 'image/jpeg' ? 'jpg' : 'png';
      const quality = mimeType === 'image/jpeg' ? 0.95 : undefined;
      const resValue = resolutionSelect.value;
      
      let finalW = canvas.width;
      let finalH = canvas.height;

      if (resValue !== 'original') {
        const parts = resValue.split('x');
        finalW = parseInt(parts[0], 10);
        finalH = parseInt(parts[1], 10);
      }

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = finalW;
      exportCanvas.height = finalH;
      const exportCtx = exportCanvas.getContext('2d');
      
      exportCtx.imageSmoothingEnabled = true;
      exportCtx.imageSmoothingQuality = 'high';
      
      // Calculate scaling to prevent stretching (simulates object-fit: cover)
      const scale = Math.max(finalW / canvas.width, finalH / canvas.height);
      const drawWidth = canvas.width * scale;
      const drawHeight = canvas.height * scale;
      
      // Center the image in the new resolution block
      const offsetX = (finalW - drawWidth) / 2;
      const offsetY = (finalH - drawHeight) / 2;

      exportCtx.drawImage(canvas, offsetX, offsetY, drawWidth, drawHeight);

      exportCanvas.toBlob((blob) => {
        if (!blob) return alert('Export engine failed to create binary blob.');
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `neural-master-${finalW}x${finalH}.${extension}`;
        a.href = url;
        a.click();
        
        setTimeout(() => {
          URL.revokeObjectURL(url);
          exportCanvas.width = 0; 
          exportCanvas.height = 0;
        }, 1500);
      }, mimeType, quality);
    };

    window.addEventListener('resize', () => {
      if (isSplitActive) updateSplit();
    });
  </script>
</body>
</html>
